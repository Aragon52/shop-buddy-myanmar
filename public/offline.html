<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>You're offline — Maket</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: "Plus Jakarta Sans", system-ui, sans-serif;
        background: #ffffff;
        color: #1f2033;
        padding: 24px;
      }
      .card {
        max-width: 22rem;
        text-align: center;
      }
      h1 {
        font-size: 1.25rem;
        margin: 0 0 0.5rem;
      }
      p {
        margin: 0;
        font-size: 0.9rem;
        color: #6b6d80;
      }
      strong {
        color: #4f46e5;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>You're offline</h1>
      <p>
        <strong>Maket</strong> needs a connection to load new orders. Check your data or Wi-Fi and
        try again.
      </p>
    </div>
  </body>
</html>
